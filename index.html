<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Orderly — Seller Command Center</title>
    <meta name="description" content="Streamlined order fulfillment and management pipeline for Sri Lankan merchants." />

    <!-- App Icons (PNG — works everywhere including iOS) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#006241" />

    <!-- Mobile Web App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orderly" />

    <!-- Prevent iOS from auto-linking phone numbers in text -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="bg-[#F4F6F4] text-[#18181B] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
